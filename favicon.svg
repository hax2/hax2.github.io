<!-- Option 1: Classic Friendly Cartoon Boy -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ea854"/>
      <stop offset="100%" stop-color="#185f2e"/>
    </linearGradient>
    <linearGradient id="skin1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe3c6"/>
      <stop offset="100%" stop-color="#f7cb9b"/>
    </linearGradient>
    <linearGradient id="hairGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a2e1b"/>
      <stop offset="100%" stop-color="#2b170c"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="28" fill="url(#bg1)"/>
  <path d="M 0 28 C 0 12.5 12.5 0 28 0 L 100 0 C 115.5 0 128 12.5 128 28 C 128 32 120 45 64 45 C 8 45 0 32 0 28 Z" fill="#ffffff" fill-opacity="0.12"/>

  <!-- Neck & Clothes -->
  <rect x="55" y="86" width="18" height="16" rx="4" fill="#ebb185"/>
  <path d="M 28 128 C 28 104 44 98 64 98 C 84 98 100 104 100 128 Z" fill="#ffffff"/>
  <path d="M 52 98 C 52 108 76 108 76 98 Z" fill="#38bdf8"/>

  <!-- Ears -->
  <circle cx="33" cy="69" r="9" fill="#f7cb9b"/>
  <circle cx="33" cy="69" r="5.5" fill="#ebb185"/>
  <circle cx="95" cy="69" r="9" fill="#f7cb9b"/>
  <circle cx="95" cy="69" r="5.5" fill="#ebb185"/>

  <!-- Head Base (Full skin circle/oval) -->
  <circle cx="64" cy="66" r="31" fill="url(#skin1)"/>

  <!-- Solid Hair Helmet/Crown with Bangs -->
  <path d="M 32 66 
           C 28 28 42 16 64 16 
           C 86 16 100 28 96 66 
           C 95 72 90 70 88 62 
           C 86 48 80 42 74 46 
           C 68 40 62 43 56 47 
           C 50 40 42 43 38 56 
           C 36 68 33 72 32 66 Z" 
        fill="url(#hairGrad1)"/>
  
  <!-- Cute hair tuft at the top -->
  <path d="M 64 16 Q 71 8 77 12 Q 71 14 67 18 Z" fill="#4a2e1b"/>
  <!-- Hair highlight -->
  <path d="M 46 25 C 56 21 72 21 82 25" fill="none" stroke="#784e31" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M 44 57 Q 50 54 56 56" fill="none" stroke="#4a2e1b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 72 56 Q 78 54 84 57" fill="none" stroke="#4a2e1b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyes - warm and friendly with big pupils and highlights -->
  <circle cx="50" cy="67" r="6" fill="#1b2129"/>
  <circle cx="78" cy="67" r="6" fill="#1b2129"/>
  <circle cx="48" cy="65" r="2.2" fill="#ffffff"/>
  <circle cx="76" cy="65" r="2.2" fill="#ffffff"/>
  <circle cx="52" cy="69" r="1.1" fill="#ffffff"/>
  <circle cx="80" cy="69" r="1.1" fill="#ffffff"/>

  <!-- Rosy cheeks blush -->
  <circle cx="43" cy="76" r="5" fill="#f87171" fill-opacity="0.35"/>
  <circle cx="85" cy="76" r="5" fill="#f87171" fill-opacity="0.35"/>

  <!-- Cute smile -->
  <path d="M 56 77 Q 64 86 72 77" fill="none" stroke="#991b1b" stroke-width="3" stroke-linecap="round"/>
</svg>
